<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Make it here. Play it wherever it belongs.</title><desc id="desc">A project moves from making, to a portable bundle, to web play.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0e10"/><stop offset="1" stop-color="#171b1e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#bd6746"/><stop offset="1" stop-color="#e2a27e"/></linearGradient>
    <linearGradient id="make" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d262b"/><stop offset="1" stop-color="#171a1d"/></linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b201d"/><stop offset="1" stop-color="#1b1716"/></linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19262a"/><stop offset="1" stop-color="#171b1e"/></linearGradient>
    <style>.s{font-family:Inter, Segoe UI, Arial, sans-serif}.num{fill:#d79a72;font-size:16px;font-weight:800;letter-spacing:1.8px}.title{fill:#f4f1ed;font-size:30px;font-weight:800;letter-spacing:-1px}.body{fill:#b5bdc0;font-size:20px;font-weight:500}.small{fill:#96a1a5;font-size:16px;font-weight:600}.strong{fill:#f4f1ed;font-size:27px;font-weight:800}.button{fill:#f4f1ed;font-size:19px;font-weight:800}</style>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect x="80" y="52" width="450" height="410" rx="22" fill="url(#make)" stroke="#3a4347" stroke-width="2"/><circle cx="80" cy="52" r="30" fill="url(#accent)"/><text x="80" y="62" text-anchor="middle" class="s" fill="#131719" font-size="28" font-weight="900">01</text>
  <text x="116" y="102" class="s num">01 / MAKE</text><text x="116" y="156" class="s title">Make in the app</text><text x="116" y="200" class="s body">Shape scenes, rules, and details</text><text x="116" y="230" class="s body">where you can see them.</text>
  <rect x="116" y="278" width="378" height="128" rx="14" fill="#101315" stroke="#495156"/><rect x="136" y="300" width="92" height="84" rx="9" fill="#263236"/><path d="M153 320h58m-58 17h42m-42 17h52" stroke="#91a0a4" stroke-width="4" stroke-linecap="round"/><rect x="247" y="300" width="226" height="84" rx="9" fill="#2f514e"/><circle cx="359" cy="342" r="20" fill="#bd6746"/><path d="M351 330l18 12-18 12z" fill="#f4f1ed"/>
  <rect x="575" y="52" width="450" height="410" rx="22" fill="url(#pack)" stroke="#bd6746" stroke-width="3"/><circle cx="575" cy="52" r="30" fill="url(#accent)"/><text x="575" y="62" text-anchor="middle" class="s" fill="#131719" font-size="28" font-weight="900">02</text>
  <text x="611" y="102" class="s num">02 / TAKE</text><text x="611" y="156" class="s title">Take the project with you</text><text x="611" y="200" class="s body">The whole project travels</text><text x="611" y="230" class="s body">as one portable bundle.</text>
  <rect x="651" y="286" width="298" height="100" rx="14" fill="#101315" stroke="#725047"/><path d="M691 315h95v44h-95z" fill="#3a5156"/><path d="M691 315l48 27 47-27" fill="#4e7070"/><path d="M739 342v17" stroke="#d79a72" stroke-width="4"/><rect x="809" y="315" width="105" height="44" rx="8" fill="#bd6746"/><text x="862" y="343" text-anchor="middle" class="s button" font-size="15">BUNDLE</text>
  <rect x="1070" y="52" width="450" height="410" rx="22" fill="url(#play)" stroke="#3a4347" stroke-width="2"/><circle cx="1070" cy="52" r="30" fill="url(#accent)"/><text x="1070" y="62" text-anchor="middle" class="s" fill="#131719" font-size="28" font-weight="900">03</text>
  <text x="1106" y="102" class="s num">03 / PLAY</text><text x="1106" y="156" class="s title">Open it where it belongs</text><text x="1106" y="200" class="s body">Play it in a browser, from</text><text x="1106" y="230" class="s body">a link, or in your own setup.</text>
  <rect x="1106" y="278" width="378" height="128" rx="14" fill="#101315" stroke="#495156"/><rect x="1126" y="298" width="338" height="18" rx="9" fill="#293236"/><circle cx="1143" cy="307" r="4" fill="#d79a72"/><circle cx="1156" cy="307" r="4" fill="#d79a72"/><path d="M1126 385c45-56 81-31 118-53 34-20 77 8 110 41 28-25 61-30 110 12H1126z" fill="#3d5554"/><circle cx="1304" cy="365" r="24" fill="#bd6746"/><path d="M1296 352l20 13-20 13z" fill="#f4f1ed"/>
  <rect x="80" y="520" width="1440" height="140" rx="22" fill="#171d1f" stroke="#3a4347" stroke-width="2"/><text x="116" y="563" class="s num">FROM MAKING TO PLAYING</text><text x="116" y="607" class="s strong">Make it here. Play it wherever it belongs.</text><text x="116" y="637" class="s body">The project stays together from the desk to the web.</text><rect x="1150" y="563" width="320" height="52" rx="26" fill="url(#accent)"/><text x="1310" y="596" text-anchor="middle" class="s button">MAKE · TAKE · PLAY</text>
